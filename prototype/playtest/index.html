<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarline — Contact Racing v1.0</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: "Segoe UI", system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #f4f4f8; text-shadow: 0 2px 8px rgba(0,0,0,.85); }
    #hud .top { position: absolute; top: 20px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    #hud h1 { font-size: 1.42rem; letter-spacing: 0.22em; font-weight: 900; color: #ff7655; text-shadow: 0 0 22px rgba(255,107,74,.38); }
    #hud .sub { font-size: 0.66rem; letter-spacing: 0.17em; opacity: 0.72; margin-top: 4px; }
    #hud .hint { font-size: 0.68rem; opacity: 0.86; max-width: 470px; line-height: 1.65; margin-top: 11px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; background: rgba(8,11,17,.48); backdrop-filter: blur(8px); }
    #stats { text-align: right; font-size: 0.72rem; line-height: 1.65; min-width: 220px; padding: 11px 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; background: rgba(8,11,17,.55); backdrop-filter: blur(9px); }
    #speed-panel { position:absolute; left:24px; bottom:28px; min-width:160px; padding:12px 16px; border:1px solid rgba(255,255,255,.16); border-radius:10px; background:rgba(8,11,17,.62); backdrop-filter:blur(10px); }
    #speed-value { font-size:2.1rem; font-weight:900; letter-spacing:-.06em; line-height:1; }
    #speed-unit { font-size:.62rem; letter-spacing:.18em; opacity:.65; margin-left:6px; }
    #car-condition { margin-top:8px; font-size:.62rem; letter-spacing:.12em; color:#ffd166; }
    #damage-track { height:4px; background:rgba(255,255,255,.16); border-radius:4px; overflow:hidden; margin-top:6px; }
    #damage-fill { height:100%; width:0%; background:linear-gradient(90deg,#f3d35c,#ff6b4a,#e52d48); transition:width .15s; }
    @media(max-width:700px){ #hud .top{left:12px;right:12px;top:12px} #hud .hint{max-width:55vw;font-size:.58rem} #stats{min-width:0;font-size:.62rem;padding:8px} #speed-panel{left:12px;bottom:18px;min-width:125px} #speed-value{font-size:1.7rem} #boost-wrap{bottom:24px;left:auto;right:12px;transform:none;width:38vw} #menu-hint{display:none} }
    #boost-wrap { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); width: min(460px, 86vw); }
    #boost-label { text-align: center; font-size: 0.65rem; letter-spacing: 0.22em; margin-bottom: 6px; opacity: 0.92; }
    #boost-bar { height: 16px; background: rgba(0,0,0,.45); border-radius: 10px; border: 1px solid rgba(255,255,255,.18); overflow: hidden; box-shadow: 0 4px 24px rgba(255,107,74,.15); }
    #boost-fill { height: 100%; width: 35%; background: linear-gradient(90deg, #ff6b4a, #ffd166, #fff); border-radius: 9px; box-shadow: 0 0 20px rgba(255,107,74,.6); transition: width 0.06s linear; }
    #msg { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%); font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 800; letter-spacing: 0.12em; opacity: 0; color: #ffd166; }
    #flash { position: fixed; inset: 0; background: radial-gradient(circle, rgba(255,107,74,.45), transparent 70%); opacity: 0; pointer-events: none; }
    #burnout-banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transform: scale(0.75); transition: opacity .08s, transform .12s; }
    #burnout-banner span { font-size: clamp(2.5rem, 9vw, 5.5rem); font-weight: 900; letter-spacing: 0.14em; color: #fff; text-shadow: 0 0 30px rgba(255,90,40,.95), 0 4px 0 #a81400; -webkit-text-stroke: 1px rgba(0,0,0,.35); }
    #burnout-banner.wrecked span { color: #ffd166; text-shadow: 0 0 26px rgba(255,50,50,.95), 0 4px 0 #8a0900; }
    #speed-lines { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: repeating-conic-gradient(from 180deg at 50% 50%, transparent 0deg, rgba(255,255,255,.07) 2deg, transparent 4deg); mix-blend-mode: screen; }
    body.fx-wrecked canvas { filter: saturate(0.35) contrast(1.1); transition: filter .25s; }
    #menu-hint { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; letter-spacing: 0.06em; opacity: 0.65; text-align: center; white-space: nowrap; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="top">
      <div>
        <h1>SCARLINE</h1>
        <p class="sub">CONTACT RACING · BUILD 2.0 · VISUAL</p>
        <p class="hint">
          W/↑ acelerar · S/↓ frenar · A/D girar · <strong>X boost</strong><br/>
          <strong>1–3</strong> circuito · <strong>C</strong> coche · <strong>R</strong> reiniciar · Mando: gatillos + stick izq. + X/A
        </p>
      </div>
      <div id="stats">—</div>
    </div>
    <div id="msg"></div>
    <div id="speed-panel"><div><span id="speed-value">000</span><span id="speed-unit">KM/H</span></div><div id="car-condition">CARROCERÍA · 0% DAÑO</div><div id="damage-track"><div id="damage-fill"></div></div></div>
    <p id="menu-hint">Circuito destacado: Scarline GP · 2 vueltas</p>
    <div id="boost-wrap">
      <div id="boost-label">BOOST · X</div>
      <div id="boost-bar"><div id="boost-fill"></div></div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="speed-lines"></div>
  <div id="burnout-banner" aria-hidden="true"><span></span></div>
  <script type="module" src="./js/scarline-playtest.js"></script>
</body>
</html>
